name: Deploy Token Server

on:
  push:
    branches: [ "main" ]
    paths:
      - "token-server/**"
      - ".github/workflows/token-server.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: token-server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Check required secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AGORA_ID: ${{ secrets.AGORA_APP_ID }}
          AGORA_CERT: ${{ secrets.AGORA_APP_CERTIFICATE }}
        run: |
          missing=""
          if [ -z "$CF_TOKEN" ]; then missing="$missing CLOUDFLARE_API_TOKEN"; fi
          if [ -z "$CF_ACCOUNT" ]; then missing="$missing CLOUDFLARE_ACCOUNT_ID"; fi
          if [ -z "$AGORA_ID" ]; then missing="$missing AGORA_APP_ID"; fi
          if [ -z "$AGORA_CERT" ]; then missing="$missing AGORA_APP_CERTIFICATE"; fi
          if [ -n "$missing" ]; then
            echo "::error::أسرار ناقصة في GitHub Secrets:$missing"
            exit 1
          fi

      # 1) النشر أولاً، وهذه الخطوة تُنشئ الـWorker إن لم يكن موجوداً
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: token-server

      # 2) رفع الأسرار بعد وجود الـWorker، والقيم تأتي من GitHub Secrets مباشرة
      - name: Upload Worker secrets
        working-directory: token-server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
          AGORA_APP_CERTIFICATE: ${{ secrets.AGORA_APP_CERTIFICATE }}
        run: |
          printf '%s' "$AGORA_APP_ID" | npx --yes wrangler@4 secret put AGORA_APP_ID
          printf '%s' "$AGORA_APP_CERTIFICATE" | npx --yes wrangler@4 secret put AGORA_APP_CERTIFICATE
