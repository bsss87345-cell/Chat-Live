# ═══════════════════════════════════════════════════════════════════════════
#  🔑 توليد مفتاح توقيع الإصدار — **يُشغَّل مرة واحدة فقط من الجوال**
#
#  الاستخدام:
#    1) انسخ هذا الملف إلى: .github/workflows/generate-keystore.yml
#    2) Actions ← «Generate Upload Keystore» ← Run workflow
#    3) انسخ الناتج (كلمتا السر + الكتلة base64) واحفظهما فوراً
#    4) 🗑️ **احذف هذا الملف فوراً** ثم **احذف التشغيل من صفحة Actions**
#       (لأن سجل التشغيل يحوي المفتاح — لا تتركه)
#
#  ⚠️ ما يظهر في سجل التشغيل هو **مفتاحك الخاص** — صفحة السجل خاصة بك وحدك،
#     لكن الأفضل حذفها بعد النسخ. والأهم: **احفظ نسخة آمنة** من المفتاح وكلمتَي السرّ.
# ═══════════════════════════════════════════════════════════════════════════
name: Generate Upload Keystore (run once)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore + print values
        run: |
          set -e
          # كلمتا سر عشوائيتان قويتان (24 حرفاً) — نحفظهما فهماً بالمفتاح
          STORE_PASSWORD=$(head -c 32 /dev/urandom | base64 | tr -d '/+=' | head -c 24)
          KEY_PASSWORD="$STORE_PASSWORD"

          # مفتاح RSA بطول 2048 صالح 30 سنة (10950 يوماً) — الاسم المستعار "upload"
          # ⚠️ الاسم المستعار **لازم** يكون upload لأن build.gradle.kts يقرأ keyAlias = "upload"
          keytool -genkeypair -v \
            -keystore upload-key.jks \
            -alias upload \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -dname "CN=Chat Live, OU=Mobile, O=Chat Live, L=Baghdad, C=IQ"

          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo " 1) كلمتا السر — احفظهما في مكان آمن الآن"
          echo "════════════════════════════════════════════════════════════"
          echo "STORE_PASSWORD=$STORE_PASSWORD"
          echo "KEY_PASSWORD=$KEY_PASSWORD"
          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo " 2) بصمة المفتاح (لتتأكد لاحقاً أن التوقيع هو نفسه)"
          echo "════════════════════════════════════════════════════════════"
          keytool -list -v -keystore upload-key.jks -storepass "$STORE_PASSWORD" 2>/dev/null | grep -E "SHA256:|SHA1:|Valid from" || true
          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo " 3) الكتلة base64 — انسخ كل ما بين السطرين كاملاً في سطر واحد"
          echo "════════════════════════════════════════════════════════════"
          echo ">>> بداية الكتلة >>>"
          base64 -w0 upload-key.jks
          echo ""
          echo "<<< نهاية الكتلة <<<"
