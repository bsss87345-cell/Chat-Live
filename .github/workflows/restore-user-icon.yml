# ════════════════════════════════════════════════════════════════════
#  🔵 استرجاع أيقونة تطبيق المستخدم (الفيروزية الأصلية)
#
#  الاستخدام (مرة واحدة فقط):
#    1) ضع هذا الملف في المستودع بالمسار:  .github/workflows/restore-user-icon.yml
#    2) Actions ← «Restore User App Icon» ← Run workflow
#    3) انتظر ~20 ثانية ← اقرأ «✅ تم الاسترجاع»
#    4) 🗑️ احذف هذا الملف بعد التأكد (لم يُعد له داعٍ)
#
#  ماذا يفعل: يجلب الملف الأصلي من تاريخ المستودع (الالتزام bbaef63)
#  ويتحقق من بصمته ثم يثبّته — نفس الملف بالبايت (MD5 مطابق).
# ════════════════════════════════════════════════════════════════════
name: Restore User App Icon (run once)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: الجلب من تاريخ المستودع
        run: |
          curl -sfL -o app/src/main/res/drawable/ic_launcher_fg.png \
            "https://raw.githubusercontent.com/bsss87345-cell/Chat-Live/bbaef63/app/src/main/res/drawable/ic_launcher_fg.png"
          echo "✅ نُزّل الملف"

      - name: التحقق (الحجم + البصمة + أنه PNG)
        run: |
          set -e
          F=app/src/main/res/drawable/ic_launcher_fg.png
          SIZE=$(stat -c%s "$F")
          MD5=$(md5sum "$F" | cut -d' ' -f1)
          echo "الحجم : $SIZE بايت"
          echo "البصمة: $MD5"
          if [ "$SIZE" -ne 131224 ]; then echo "❌ الحجم غير متوقع"; exit 1; fi
          if [ "$MD5" != "b8d18b2b617a7a61eccf57fd44afdd44" ]; then echo "❌ البصمة غير مطابقة"; exit 1; fi
          file "$F" | grep -q "PNG image data" || { echo "❌ ليس ملف PNG"; exit 1; }
          echo "✅ الملف الأصلي سليم ومطابق 100%"

      - name: التثبيت (Commit + Push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable/ic_launcher_fg.png
          if git diff --cached --quiet; then
            echo "ℹ️ لا تغيير — الأيقونة أصلية أصلاً (لا شي نعمله)"
          else
            git commit -m "Restore original app icon (teal) for user edition"
            git push
            echo "✅ تم استرجاع الأيقونة الأصلية"
          fi
