name: Build & Package Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Prepare Local Environment (.env)
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # نسخة التعديلات: نفس الكود بمعرّف تطبيق واسم وأيقونة مختلفين
      # ⇒ تُثبَّت جنباً إلى جنب مع نسخة المستخدم (لا تستبدلها ولا تتعارض معها)
      - name: Build Edits APK (developer edition)
        run: ./gradlew assembleEdits --stacktrace

      - name: Upload Edits APK as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-edits-apk
          path: app/build/outputs/apk/edits/*.apk
          retention-days: 14

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --tests "com.example.ExampleUnitTest" --stacktrace

            # ⚠️ أمان: نسخة الإصدار تُبنى بمفتاح حقيقي فقط.
      # لو السرّ غير موجود، البناء يكمل **بلا توقيع** ولا يُرفع المخرَج — 
      # سابقاً كان يرفع APK موقّعاً بتوقيع Debug (مشترك ومعروف = خطر انتحال التحديثات).
      - name: Build Release APK (requires real signing key)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_ENV"
            echo "✅ مفتاح الإصدار موجود — ستُوقَّع النسخة توقيعاً حقيقياً"
          else
            echo "::warning::لا يوجد سرّ KEYSTORE_BASE64 — النسخة ستُبنى بلا توقيع ولن تُرفع. راجع README للتوقيع."
          fi
          ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK (only if properly signed)
        if: env.KEYSTORE_PATH != ''
        uses: actions/upload-artifact@v6
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      # نشر قواعد الأمان — **مؤجّل حتى يوجد سرّ FIREBASE_TOKEN**.
      # ممنوع أي نشر فعلي قبل مراجعة القواعد وربط Firebase Auth.
      - name: Deploy Firestore rules (skipped when no token)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "⏭️ لا يوجد سرّ FIREBASE_TOKEN — تخطّي نشر القواعد (لا اتصال بأي مشروع)."
            exit 0
          fi
          npm install -g firebase-tools
          if [ -n "$FIREBASE_PROJECT_ID" ]; then
            firebase deploy --only firestore:rules,firestore:indexes --token "$FIREBASE_TOKEN" --project "$FIREBASE_PROJECT_ID"
          else
            firebase deploy --only firestore:rules,firestore:indexes --token "$FIREBASE_TOKEN"
          fi
        continue-on-error: true
